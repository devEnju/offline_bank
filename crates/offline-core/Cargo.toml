[package]
name = "offline-core"
# The version of the stored files, not of a release: its major number is the
# journal version every record carries (`SCHEMA_VERSION`). It changes only
# when the files change in size, layout or meaning (docs/internals.md), and
# then as a whole number, "2.0.0".
version = "1.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Store operations that only the console test builds use (docs/building.md).
tear-test = []

[dependencies]
