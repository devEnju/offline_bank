[workspace]
members = ["crates/bank-common", "crates/offline-core", "crates/patch-builder", "crates/patch-common", "crates/patch-verify", "patches/bank", "patches/bank-download", "patches/bank-migrate", "patches/transporter", "xtask"]
resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.85"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true
