[package]
name = "transporter-payload"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bank-common = { path = "../../crates/bank-common" }
offline-core = { path = "../../crates/offline-core" }
patch-common = { path = "../../crates/patch-common" }

[lib]
crate-type = ["rlib"]

[features]
linked-image = []

[[bin]]
name = "transporter-payload-link"
path = "src/link.rs"
required-features = ["linked-image"]
