[package]
name = "bank-payload"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
offline-core = { path = "../../crates/offline-core" }

[lib]
crate-type = ["rlib"]

[features]
linked-image = []
# Console test builds for rehearsing an interrupted Save and Quit
# (docs/building.md). Never part of a release.
test-build = []
test-stop-before-game = ["test-build"]
test-stop-after-game = ["test-build"]
test-tear-record = ["test-build", "offline-core/tear-test"]
test-tear-boxes = ["test-build", "offline-core/tear-test"]

[[bin]]
name = "bank-payload-link"
path = "src/link.rs"
required-features = ["linked-image"]